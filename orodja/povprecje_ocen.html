<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator povprečja ocen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="index.html">← Vsa orodja</a>
        <h1>Kalkulator povprečja ocen</h1>
        <p>Vnesi ocene od 1 do 5, ločene z vejico ali presledkom.</p>
    </header>

    <main>
        <section class="kalkulator">
            <form id="obrazec">
                <label for="ocene">Tvoje ocene</label>

                <input
                    type="text"
                    id="ocene"
                    name="ocene"
                    placeholder="Na primer: 4, 5, 3, 4"
                    aria-describedby="napaka"
                    required
                >

                <div class="gumbi">
                    <button type="submit">Izračunaj</button>
                    <button type="reset">Počisti</button>
                </div>
            </form>

            <p id="napaka" class="napaka" role="alert"></p>

            <div
                id="rezultat"
                class="rezultat"
                aria-live="polite"
            ></div>
        </section>

        <section class="razlaga">
            <h2>Kako deluje?</h2>

            <p>
                Vsoto vseh ocen delimo s številom ocen.
                Vse ocene imajo enako težo.
            </p>

            <p>
                Primer: (4 + 5 + 3 + 4) ÷ 4 =
                <strong>4,00</strong>.
            </p>

            <p>Povprečje ne določa nujno zaključne ocene.</p>
        </section>
    </main>

    <script>
        const obrazec = document.getElementById("obrazec");
        const vnos = document.getElementById("ocene");
        const napaka = document.getElementById("napaka");
        const rezultat = document.getElementById("rezultat");

        obrazec.addEventListener("submit", function (dogodek) {
            dogodek.preventDefault();

            napaka.textContent = "";
            rezultat.textContent = "";
            vnos.removeAttribute("aria-invalid");

            const besedilo = vnos.value.trim();
            const dovoljeniVnos = /^[1-5](?:(?:\s*,\s*|\s+)[1-5])*$/;

            if (!dovoljeniVnos.test(besedilo)) {
                napaka.textContent =
                    "Vnesi cele ocene od 1 do 5, ločene z vejico ali presledkom.";

                vnos.setAttribute("aria-invalid", "true");
                vnos.focus();
                return;
            }

            const ocene = besedilo.split(/[\s,]+/).map(Number);
            const vsota = ocene.reduce((skupaj, ocena) => skupaj + ocena, 0);
            const povprecje = vsota / ocene.length;

            const prikaz = povprecje.toLocaleString("sl-SI", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            const naslov = document.createElement("h2");
            naslov.textContent = "Povprečje: " + prikaz;

            const podatki = document.createElement("p");
            podatki.textContent =
                "Število ocen: " + ocene.length +
                " | Vsota ocen: " + vsota;

            rezultat.append(naslov, podatki);
        });

        obrazec.addEventListener("reset", function () {
            napaka.textContent = "";
            rezultat.textContent = "";
            vnos.removeAttribute("aria-invalid");
        });
    </script>
</body>
</html>
